<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Superhero Mod Wiki</title>
<style>
:root{--bg:#f6f7fb;--panel:#fff;--ink:#1b1f2a;--mute:#5f6678;--line:#dfe3ee;--acc:#d4202c;--acc2:#1f4fd8;--chip:#eef1f8;--slot:#c6c6c6;--slot-line:#8b8b8b}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10131b;--panel:#181c27;--ink:#e8eaf2;--mute:#9aa1b5;--line:#2a3042;--acc:#ff4b57;--acc2:#6f94ff;--chip:#222839;--slot:#3a3f4f;--slot-line:#555b70}}
:root[data-theme=dark]{--bg:#10131b;--panel:#181c27;--ink:#e8eaf2;--mute:#9aa1b5;--line:#2a3042;--acc:#ff4b57;--acc2:#6f94ff;--chip:#222839;--slot:#3a3f4f;--slot-line:#555b70}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--acc2);text-decoration:none}a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;padding:10px 16px}
.brand{font-weight:800;letter-spacing:.2px;color:var(--ink)}.brand b{color:var(--acc)}
#q{flex:1;min-width:0;max-width:560px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
#q:focus{outline:2px solid var(--acc2);outline-offset:0}
.kbd{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 5px}
#theme{background:none;border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:7px 10px;cursor:pointer}
.layout{display:grid;grid-template-columns:230px 1fr;max-width:1200px;margin:0 auto}
nav{padding:16px;position:sticky;top:57px;align-self:start;max-height:calc(100vh - 57px);overflow:auto}
nav h4{margin:14px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--mute)}
nav a{display:block;padding:4px 8px;border-radius:6px;color:var(--ink)}
nav a.on{background:var(--chip);font-weight:600}nav a:hover{background:var(--chip);text-decoration:none}
main{padding:20px 16px 60px;min-width:0}
h1{margin:0 0 4px;font-size:28px}h2{margin:28px 0 10px;font-size:20px}h3{margin:0 0 6px;font-size:16px}
.lead{color:var(--mute);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:block;color:var(--ink)}
a.card:hover{border-color:var(--acc2);text-decoration:none}
.card small{color:var(--mute);display:block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding:2px 10px;font-size:14px;color:var(--ink)}
.tag{font-size:12px;border-radius:4px;padding:1px 6px;background:var(--chip);color:var(--mute);margin-left:6px;vertical-align:middle}
.tag.dc{color:var(--acc2)}.tag.marvel{color:var(--acc)}
img.ic{width:32px;height:32px;image-rendering:pixelated;vertical-align:middle;flex:none}
img.ic.sm{width:20px;height:20px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.craft{display:grid;grid-template-columns:repeat(3,52px);gap:3px;background:var(--slot);padding:6px;border:2px solid var(--slot-line);border-radius:4px;width:max-content}
.slot{width:52px;height:52px;border:2px solid var(--slot-line);background:color-mix(in srgb,var(--slot) 70%,var(--bg));display:flex;align-items:center;justify-content:center;font-size:10px;text-align:center;line-height:1.1;overflow:hidden;color:var(--ink);padding:1px;position:relative}
.slot img{width:36px;height:36px;image-rendering:pixelated}
.slot a{display:flex;align-items:center;justify-content:center;width:100%;height:100%;color:inherit}
.arrow{align-self:center;font-size:26px;color:var(--mute)}
.result{display:flex;align-items:center;gap:8px;font-weight:600}
.legend{font-size:14px;color:var(--mute);margin-top:6px}
table{border-collapse:collapse;width:100%}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 6px;background:var(--chip);font-size:13px}
.hit{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;color:var(--ink)}
.hit:hover{background:var(--chip);text-decoration:none}.hit small{color:var(--mute);margin-left:auto;text-align:right}
mark{background:#ffd95a55;color:inherit;border-radius:2px}
.crumbs{font-size:14px;color:var(--mute);margin-bottom:8px}
ol.steps{padding-left:20px}ol.steps li{margin:4px 0}
@media (max-width:760px){.layout{grid-template-columns:1fr}nav{position:static;max-height:none;padding:8px 16px;display:flex;flex-wrap:wrap;gap:4px}nav h4{display:none}.kbd{display:none}header{flex-wrap:wrap}}
</style>
</head>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MOD = "superheromod:";
const byId = Object.fromEntries(DATA.entries.map(e => [e.id, e]));
const suitByKey = Object.fromEntries(DATA.suits.map(s => [s.key, s]));
const nameOf = id => DATA.names[id] || id.split(":").pop().replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
const iconOf = id => DATA.icons[id];
const imgTag = (id, cls = "") => iconOf(id) ? `<img class="ic ${cls}" src="${esc(iconOf(id))}" alt="" loading="lazy">` : "";

function flat(r) { return [...(r.grid || []), ...(r.items || []), r.reagent].filter(Boolean); }

// who uses what (reverse index)
const usedIn = {};
DATA.entries.forEach(e => e.recipes.forEach(r => new Set(flat(r)).forEach(i => (usedIn[i] ||= new Set()).add(e.id))));

function itemLink(id, inner) {
  return id.startsWith(MOD) && byId[id.slice(MOD.length)] ? `<a href="#/item/${id.slice(MOD.length)}">${inner}</a>` : inner;
}
function chip(id) {
  return itemLink(id, `<span class="chip">${imgTag(id, "sm")}${esc(nameOf(id))}</span>`);
}
function slot(id) {
  if (!id) return `<div class="slot"></div>`;
  const inner = iconOf(id) ? `<img src="${esc(iconOf(id))}" alt="${esc(nameOf(id))}">` : esc(nameOf(id));
  return `<div class="slot" title="${esc(nameOf(id))}">${itemLink(id, inner)}</div>`;
}

function recipeView(e, r) {
  const resIcon = e.icon ? `<img class="ic" src="${esc(e.icon)}" alt="">` : "";
  if (r.kind === "shaped") {
    const mats = [...new Set(r.grid.filter(Boolean))];
    return `<div class="row"><div class="craft">${r.grid.map(slot).join("")}</div><div class="arrow">→</div>
      <div class="result">${resIcon}${esc(e.name)}${r.count > 1 ? ` ×${r.count}` : ""}</div></div>
      <div class="legend">Shaped, place exactly like this. Needs: ${mats.map(m => `${r.grid.filter(x => x === m).length}× ${esc(nameOf(m))}`).join(", ")}.</div>`;
  }
  if (r.kind === "shapeless") {
    const counts = {};
    r.items.forEach(i => counts[i] = (counts[i] || 0) + 1);
    return `<div class="row"><div class="chips">${Object.entries(counts).map(([i, n]) => `${n > 1 ? n + "× " : ""}${chip(i)}`).join(" + ")}</div>
      <div class="arrow">→</div><div class="result">${resIcon}${esc(e.name)}${r.count > 1 ? ` ×${r.count}` : ""}</div></div>
      <div class="legend">Shapeless: put them anywhere in the crafting grid.</div>`;
  }
  if (r.kind === "brewing") {
    return `<div class="row"><div class="chips">${esc(r.base)} + ${chip(r.reagent)}</div><div class="arrow">→</div><div class="result">${esc(e.name)}</div></div>
      <div class="legend">Brewing stand.</div>`;
  }
  return `<div class="legend">${esc(r.kind)}</div>`;
}

function itemPage(id) {
  const e = byId[id];
  if (!e) return notFound();
  const used = [...(usedIn[MOD + id] || [])].map(i => byId[i]).filter(Boolean);
  const hero = Object.values(DATA.suits).find(s => s.pieces.includes(id));
  return `<div class="crumbs"><a href="#/">Home</a> › ${hero ? `<a href="#/hero/${hero.key}">${esc(hero.name)}</a>` : `<a href="#/materials">Materials &amp; Blocks</a>`}</div>
    <h1>${imgTag(MOD + id)} ${esc(e.name)}</h1>
    ${e.desc ? `<p class="lead">${esc(e.desc)}</p>` : ""}
    ${e.recipes.length ? `<h2>Crafting</h2>${e.recipes.map(r => `<div class="panel">${recipeView(e, r)}</div>`).join("")}`
      : `<div class="panel">No crafting recipe.${e.obtain ? "" : " This is found in-game or from the creative tab."}</div>`}
    ${e.obtain ? `<h2>How to obtain</h2><div class="panel">${esc(e.obtain)}</div>` : ""}
    ${used.length ? `<h2>Used to make</h2><div class="chips">${used.map(u => chip(MOD + u.id)).join("")}</div>` : ""}`;
}

function heroPage(key) {
  const s = suitByKey[key];
  if (!s) return notFound();
  const pieces = s.pieces.map(p => byId[p]).filter(Boolean);
  const mats = new Set();
  pieces.forEach(p => p.recipes.forEach(r => flat(r).forEach(i => mats.add(i))));
  const base = [...mats].filter(m => !m.startsWith(MOD + s.key + "_"));
  return `<div class="crumbs"><a href="#/">Home</a> › <a href="#/suits">Suits</a></div>
    <h1>${esc(s.name)} <span class="tag ${s.universe.toLowerCase()}">${s.universe}</span></h1>
    <p class="lead">Wear all four pieces (helmet, chestplate, leggings, boots) to get the suit's effects and abilities.</p>
    <h2>What you need</h2>
    <div class="panel"><div class="chips">${base.map(chip).join("") || "—"}</div>
      <p class="legend">Craft the <b>Symbol</b> first; the chestplate needs it. Click a piece for its exact recipe.</p></div>
    <h2>Recipes</h2>
    ${pieces.map(p => `<div class="panel"><h3>${imgTag(MOD + p.id)} <a href="#/item/${p.id}">${esc(p.name)}</a></h3>${p.recipes.map(r => recipeView(p, r)).join("")}</div>`).join("")}
    <h2>Passive effects (full suit)</h2>
    <div class="panel"><div class="chips">${s.passive.map(x => `<span class="chip">${esc(x)}</span>`).join("")}</div>${s.movement ? `<p>${esc(s.movement)}</p>` : ""}</div>
    <h2>Abilities</h2>
    <div class="panel">${s.abilities.length ? `<table>${s.abilities.map(a => `<tr><td><kbd>${a.key}</kbd></td><td>${esc(a.name)}</td></tr>`).join("")}</table>` : "None."}
      <p class="legend">Default keys R / Z / X, rebindable in Controls → Superhero Mod.</p></div>`;
}

function suitsPage() {
  const group = u => DATA.suits.filter(s => s.universe === u);
  const cards = list => `<div class="grid">${list.map(s => `<a class="card" href="#/hero/${s.key}"><b>${esc(s.name)}</b>
    <small>${s.abilities.map(a => a.name).join(" · ") || "Passive effects only"}</small></a>`).join("")}</div>`;
  return `<h1>Suits</h1><p class="lead">${DATA.suits.length} suits. Pick a hero for the full recipe tree, effects and abilities.</p>
    <h2>DC</h2>${cards(group("DC"))}<h2>Marvel</h2>${cards(group("Marvel"))}`;
}

function portalsPage(only) {
  const list = DATA.portals;
  return `<h1>Portals</h1>
    <p class="lead">Two portals: one to the Speedforce, one to Atlantis. Build a frame, then right-click it with the lighter.</p>
    <div class="panel"><h3>How to build any portal</h3><ol class="steps">
      <li>Build a rectangular frame out of the portal's frame block. The empty inside must be <b>at least 2 wide and 3 tall</b> (max 21 × 21). Corners are not required.</li>
      <li>Leave the inside empty (air, or something replaceable like grass).</li>
      <li>Right-click a frame block with the lighting item, like flint and steel on obsidian. The item is used up (not in Creative).</li>
      <li>Walk in. The frame can face north-south or east-west.</li>
      <li>Ops can skip all this with <code>/heroportal build speedforce</code> or <code>/heroportal build atlantean</code>.</li></ol></div>
    ${list.map(p => `<div class="panel" id="${p.id}"><h2 style="margin-top:0">${imgTag(MOD + p.id)} ${esc(p.name)}</h2>
      <table>
        <tr><th>Leads to</th><td>${esc(p.dimension)}</td></tr>
        <tr><th>Frame block</th><td>${chip(p.frame)}</td></tr>
        <tr><th>Light it with</th><td>${chip(p.igniter)}</td></tr>
        <tr><th>Who can enter</th><td>${esc(p.requirement)}</td></tr>
        <tr><th>Arrival</th><td>${esc(p.arrive)}</td></tr>
        <tr><th>Tip</th><td>${esc(p.extra)}</td></tr>
      </table>
      <div class="legend" style="margin-top:8px">Minimum frame, side view: ${frameDiagram(p)}</div></div>`).join("")}`;
}
function frameDiagram(p) {
  const cell = c => `<span style="width:20px;height:20px;background:${c}"></span>`;
  const F = cell(p.color), P = cell("#7b4bd155"), _ = cell("transparent");
  const rows = [[_, F, F, _], [F, P, P, F], [F, P, P, F], [F, P, P, F], [_, F, F, _]];
  return `<div style="display:inline-grid;grid-template-columns:repeat(4,20px);gap:1px;margin-top:6px;vertical-align:top">${rows.flat().join("")}</div>
    <span> ${esc(p.frame_name)} frame, portal in the middle</span>`;
}

function materialsPage() {
  const list = DATA.entries.filter(e => e.category !== "Suits").sort((a, b) => a.name.localeCompare(b.name));
  return `<h1>Materials &amp; Blocks</h1><p class="lead">Everything that isn't a suit piece.</p>
    <div class="grid">${list.map(e => `<a class="card" href="#/item/${e.id}">${imgTag(MOD + e.id)} <b>${esc(e.name)}</b>
      <small>${e.recipes.length ? "Craftable" : (e.obtain ? "Found / dropped" : "No recipe")}</small></a>`).join("")}</div>`;
}

function homePage() {
  return `<h1>Superhero Mod Wiki</h1>
    <p class="lead">Press <kbd>/</kbd> to search anything: a suit, an item, an ingredient ("red wool"), or an ability ("grapple").</p>
    <div class="grid">
      <a class="card" href="#/suits"><b>Suits</b><small>${DATA.suits.length} heroes, recipes + abilities</small></a>
      <a class="card" href="#/portals"><b>Portals</b><small>Speedforce and Atlantis</small></a>
      <a class="card" href="#/materials"><b>Materials &amp; Blocks</b><small>Cores, ingots, ores, potions</small></a>
    </div>
    <h2>Getting started</h2>
    <div class="panel"><ol class="steps">
      <li>Pick a hero under <a href="#/suits">Suits</a> and gather its materials. Most suits are built from wool and a special core or ingot.</li>
      <li>Craft the <b>Symbol</b> first, then the four armor pieces.</li>
      <li>Wear the full set, then press <kbd>R</kbd> / <kbd>Z</kbd> / <kbd>X</kbd> for abilities.</li>
      <li>Build a <a href="#/portals">portal</a> to reach the Speedforce or Atlantis.</li></ol></div>`;
}

function notFound() { return `<h1>Not found</h1><p class="lead">Try the search box.</p>`; }

// ---------------------------------------------------------------- search
const INDEX = [];
DATA.entries.forEach(e => INDEX.push({
  href: `#/item/${e.id}`, title: e.name, sub: e.category === "Suits" ? e.group : "Item",
  text: [e.name, e.group, e.obtain, ...e.recipes.flatMap(r => flat(r).map(nameOf))].join(" ").toLowerCase(), icon: MOD + e.id,
  boost: 2 }));
DATA.suits.forEach(s => INDEX.push({
  href: `#/hero/${s.key}`, title: s.name, sub: "Hero · " + s.universe,
  text: [s.name, s.universe, ...s.passive, ...s.abilities.map(a => a.name), s.movement, "suit hero armor abilities"].join(" ").toLowerCase(), boost: 4 }));
DATA.portals.forEach(p => INDEX.push({
  href: `#/portals`, title: p.name, sub: "Portal",
  text: [p.name, p.dimension, p.frame_name, p.igniter_name, p.requirement, p.extra, "portal dimension"].join(" ").toLowerCase(), icon: MOD + p.id, boost: 4 }));

const stem = t => t.replace(/(ing|ed|es|s|e)$/, "");
function search(q) {
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (!terms.length) return [];
  return INDEX.map(d => {
    let score = 0;
    for (const t of terms) {
      const title = d.title.toLowerCase();
      if (title === t) score += 20;
      else if (title.startsWith(t)) score += 12;
      else if (title.includes(t)) score += 8;
      else if (d.text.includes(t)) score += 3;
      else if (stem(t).length >= 4 && d.text.includes(stem(t))) score += 2;
      else return null;
    }
    return { d, score: score + d.boost };
  }).filter(Boolean).sort((a, b) => b.score - a.score || a.d.title.localeCompare(b.d.title)).map(x => x.d);
}
function mark(text, q) {
  let out = esc(text);
  q.split(/\s+/).filter(Boolean).forEach(t => {
    out = out.replace(new RegExp("(" + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig"), "<mark>$1</mark>");
  });
  return out;
}
function searchPage(q) {
  const res = search(q);
  return `<h1>Search</h1><p class="lead">${res.length} result${res.length === 1 ? "" : "s"} for “${esc(q)}”</p>
    <div class="panel" style="padding:0">${res.map(r => `<a class="hit" href="${r.href}">${r.icon ? imgTag(r.icon) : ""}<span>${mark(r.title, q)}</span><small>${esc(r.sub)}</small></a>`).join("") || `<div class="hit">Nothing matches. Try a shorter word.</div>`}</div>`;
}

// ---------------------------------------------------------------- nav + routing
function navHtml(route) {
  const a = (href, label) => `<a href="${href}" class="${route === href ? "on" : ""}">${label}</a>`;
  return a("#/", "Home") + a("#/suits", "All suits") + a("#/portals", "Portals") + a("#/materials", "Materials &amp; Blocks")
    + `<h4>DC</h4>` + DATA.suits.filter(s => s.universe === "DC").map(s => a(`#/hero/${s.key}`, esc(s.name))).join("")
    + `<h4>Marvel</h4>` + DATA.suits.filter(s => s.universe === "Marvel").map(s => a(`#/hero/${s.key}`, esc(s.name))).join("");
}
function render() {
  const hash = location.hash || "#/";
  const [path, query] = hash.slice(1).split("?");
  const parts = path.split("/").filter(Boolean);
  let html;
  if (parts[0] === "search") html = searchPage(decodeURIComponent((query || "").replace(/^q=/, "")));
  else if (parts[0] === "suits") html = suitsPage();
  else if (parts[0] === "hero") html = heroPage(parts[1]);
  else if (parts[0] === "item") html = itemPage(parts[1]);
  else if (parts[0] === "portals") html = portalsPage();
  else if (parts[0] === "materials") html = materialsPage();
  else html = homePage();
  $("#main").innerHTML = html;
  $("#nav").innerHTML = navHtml(hash.split("?")[0]);
  document.title = (parts[0] === "hero" && suitByKey[parts[1]] ? suitByKey[parts[1]].name + " · " : "") + "Superhero Mod Wiki";
  if (!(parts[0] === "search")) window.scrollTo(0, 0);
}
window.addEventListener("hashchange", render);
$("#q").addEventListener("input", e => {
  const v = e.target.value.trim();
  if (v) history.replaceState(null, "", "#/search?q=" + encodeURIComponent(v)), render();
  else { history.replaceState(null, "", "#/"); render(); }
});
$("#q").addEventListener("keydown", e => {
  if (e.key === "Enter") { const r = search(e.target.value)[0]; if (r) location.hash = r.href; }
  if (e.key === "Escape") e.target.blur();
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
});
$("#theme").addEventListener("click", () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark";
  try { localStorage.setItem("wiki-theme", document.documentElement.dataset.theme); } catch (_) {}
});
try { const t = localStorage.getItem("wiki-theme"); if (t) document.documentElement.dataset.theme = t; } catch (_) {}
if ((location.hash || "").startsWith("#/search?q=")) $("#q").value = decodeURIComponent(location.hash.split("q=")[1] || "");
render();
</script>
